<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찬양 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FFFFFF;
    --paper-deep: #EFE9D9;
    --ink: #2B2A25;
    --ink-soft: #6B6656;
    --navy: #26324A;
    --sage: #6E7F5C;
    --gold: #B8863B;
    --line: #DCD3BC;
    --card: #FCFAF3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    font-weight:300;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold); color:#fff;}
 
  a{color:inherit;}
 
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 24px 120px;
  }
 
  /* Header */
  header.top{
    padding:64px 0 40px;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }
  header.top .kicker{
    font-size:13px;
    color:var(--sage);
    letter-spacing:0.02em;
    margin-bottom:10px;
  }
  header.top h1{
    font-family:'Gowun Dodum', serif;
    font-weight:700;
    font-size:38px;
    color:var(--navy);
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  header.top p{
    color:var(--ink-soft);
    font-size:15px;
    max-width:480px;
    margin:0;
  }
 
  /* Tabs */
  .tabs{
    display:flex;
    gap:4px;
    margin-bottom:36px;
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    background:none;
    border:none;
    font-family:'Gowun Dodum', sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink-soft);
    padding:10px 16px 14px;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  .tab-btn.active{
    color:var(--navy);
    border-bottom:2px solid var(--gold);
  }
 
  .view{display:none;}
  .view.active{display:block;}
 
  /* Add button */
  .add-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
    gap:12px;
    flex-wrap:wrap;
  }
  .mode-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:20px;
    overflow:hidden;
  }
  .mode-btn{
    background:var(--card);
    border:none;
    font-family:'Gowun Dodum', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    padding:7px 16px;
    cursor:pointer;
  }
  .mode-btn.active{
    background:var(--navy);
    color:var(--paper);
  }
  .btn{
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:10px 20px;
    border-radius:3px;
    border:1px solid var(--navy);
    background:var(--navy);
    color:var(--paper);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .btn:hover{background:#33415d;}
  .btn.ghost{
    background:transparent;
    color:var(--navy);
    border:1px solid var(--line);
  }
  .btn.ghost:hover{border-color:var(--navy);}
  .btn.small{padding:6px 12px; font-size:13px;}
 
  /* Timeline */
  .month-group{margin-bottom:44px;}
  .month-label{
    font-family:'Gowun Dodum', serif;
    font-size:15px;
    font-weight:600;
    color:var(--sage);
    margin-bottom:16px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .entry{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:18px;
    padding:20px 0;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .date{
    font-family:'Gowun Dodum', serif;
    font-size:13px;
    color:var(--ink-soft);
    padding-top:3px;
  }
  .entry .date .d{
    display:block;
    font-size:22px;
    color:var(--navy);
    font-weight:600;
    line-height:1.1;
  }
  .entry .theme{
    font-family:'Gowun Dodum', serif;
    font-size:18px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 10px;
  }
  .recorder{
    font-size:12px;
    color:var(--ink-soft);
    margin:-4px 0 10px;
  }
  .song-list{list-style:none; margin:0 0 10px; padding:0;}
  .song-list li{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:14.5px;
    padding:4px 0;
    color:var(--ink);
  }
  .song-list li .star{
    cursor:pointer;
    color:var(--line);
    font-size:15px;
    user-select:none;
  }
  .song-list li .star.on{color:var(--gold);}
  .song-list li .song-title{font-weight:500;}
  .song-list li .song-artist{color:var(--ink-soft); font-size:13.5px;}
  .song-list li a.link{
    color:var(--sage);
    font-size:12.5px;
    text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .comment{
    font-size:13.5px;
    color:var(--ink-soft);
    font-style:italic;
    margin:8px 0 0;
    padding-left:14px;
    border-left:2px solid var(--line);
  }
  .entry-actions{
    margin-top:10px;
  }
  .entry-actions button{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12px;
    cursor:pointer;
    padding:0;
    margin-right:14px;
    text-decoration:underline;
    text-underline-offset:2px;
  }
 
  .empty{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-soft);
  }
  .empty .big{
    font-family:'Gowun Dodum', serif;
    font-size:20px;
    color:var(--navy);
    margin-bottom:10px;
  }
 
  /* Calendar */
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .cal-title{
    font-family:'Gowun Dodum', serif;
    font-size:18px;
    font-weight:600;
    color:var(--navy);
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
  }
  .cal-dow{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:8px 0;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:var(--paper-deep);
  }
  .cal-cell{
    min-height:84px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:8px 6px;
    position:relative;
  }
  .cal-cell.has-entry{
    background:var(--card);
    cursor:pointer;
  }
  .cal-cell.has-entry:hover{background:#F1ECDC;}
  .cal-cell.empty-cell{background:transparent;}
  .cal-daynum{
    font-size:12px;
    color:var(--ink-soft);
  }
  .cal-cell.has-entry .cal-daynum{color:var(--navy); font-weight:600;}
  .cal-theme{
    font-family:'Gowun Dodum', serif;
    font-size:12.5px;
    color:var(--sage);
    margin-top:6px;
    line-height:1.4;
    word-break:keep-all;
  }
  .cal-dot{
    display:inline-block;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--gold);
    margin-right:4px;
  }
  @media (max-width:520px){
    .cal-cell{min-height:60px; padding:5px 4px;}
    .cal-theme{font-size:10.5px;}
  }
 
  .credit{
    position:fixed;
    right:14px;
    bottom:10px;
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.4;
    pointer-events:none;
    letter-spacing:0.01em;
    z-index:5;
  }
 
  /* Year select for best playlist */
  .year-select{
    display:flex;
    gap:8px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .year-chip{
    border:1px solid var(--line);
    background:var(--card);
    padding:7px 16px;
    border-radius:20px;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .year-chip.active{
    background:var(--navy);
    color:var(--paper);
    border-color:var(--navy);
  }
  .best-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:4px;
    padding:32px;
  }
  .best-card h2{
    font-family:'Gowun Dodum', serif;
    color:var(--navy);
    font-size:24px;
    margin:0 0 6px;
  }
  .best-card .sub{
    color:var(--ink-soft);
    font-size:13.5px;
    margin-bottom:24px;
  }
  .best-song{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .best-song:last-child{border-bottom:none;}
  .best-song .num{
    font-family:'Gowun Dodum', serif;
    color:var(--gold);
    font-size:16px;
    width:24px;
  }
  .best-song .info .t{font-weight:500; font-size:15px;}
  .best-song .info .a{color:var(--ink-soft); font-size:13px;}
  .best-song .meta{
    margin-left:auto;
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
 
  /* Modal */
  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(38,50,74,0.35);
    z-index:50;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px;
    overflow:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);
    border-radius:6px;
    max-width:520px;
    width:100%;
    padding:32px;
    border:1px solid var(--line);
  }
  .modal h2{
    font-family:'Gowun Dodum', serif;
    color:var(--navy);
    font-size:20px;
    margin:0 0 20px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:50px;}
  .song-fields{
    border:1px dashed var(--line);
    padding:14px;
    border-radius:4px;
    margin-bottom:10px;
    position:relative;
  }
  .song-fields .remove-song{
    position:absolute;
    top:8px;
    right:10px;
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;
  }
  .song-fields .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
  }
  .add-song-link{
    background:none;
    border:none;
    color:var(--sage);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:2px;
    padding:0 0 12px;
  }
 
  /* Cover image input */
  .cover-input{
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .cover-preview{
    width:88px;
    height:88px;
    border-radius:4px;
    border:1px dashed var(--line);
    background:var(--paper-deep);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    overflow:hidden;
  }
  .cover-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .cover-controls{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .cover-controls input[type="file"]{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .cover-controls input[type="text"]{
    width:100%;
    font-family:'Gowun Dodum', sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
  }
 
  /* Album grid */
  .scores-toolbar{
    display:flex;
    gap:12px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .score-search{
    flex:1;
    min-width:160px;
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    padding:9px 14px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--card);
    color:var(--ink);
  }
  .album-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  .album-card{
    cursor:pointer;
  }
  .album-thumb{
    width:100%;
    aspect-ratio:1/1;
    border-radius:4px;
    overflow:hidden;
    background:var(--paper-deep);
    border:1px solid var(--line);
  }
  .album-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .album-thumb.loading{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--ink-soft);
  }
  .album-cap{
    margin-top:8px;
    font-family:'Gowun Dodum', serif;
    font-size:13px;
    color:var(--navy);
    line-height:1.4;
  }
  .album-cap .date{
    display:block;
    font-family:'Gowun Dodum', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  @media (max-width:520px){
    .album-grid{grid-template-columns:repeat(2, 1fr);}
    .cover-input{flex-direction:column;}
  }
 
  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy);
    color:var(--paper);
    padding:12px 22px;
    border-radius:4px;
    font-size:13.5px;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
    z-index:80;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
 
  @media (max-width:520px){
    header.top{padding:44px 0 30px;}
    header.top h1{font-size:30px;}
    .entry{grid-template-columns:48px 1fr; gap:12px;}
    .best-card{padding:22px;}
  }
</style>
</head>
<body>
 
<div class="wrap">
  <header class="top">
    <div class="kicker">소모임 찬양 아카이브</div>
    <h1>매주, 우리가 고른 찬양</h1>
    <p>매주 정한 주제와 함께 고른 곡들을 이곳에 쌓아둡니다. 모든 기록은 소모임 구성원 모두에게 공유됩니다.</p>
  </header>
 
  <div class="tabs">
    <button class="tab-btn active" data-view="timeline">타임라인</button>
    <button class="tab-btn" data-view="scores">악보함</button>
    <button class="tab-btn" data-view="best">연말 베스트</button>
  </div>
 
  <!-- Timeline view -->
  <div class="view active" id="view-timeline">
    <div class="add-row">
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="list">목록</button>
        <button class="mode-btn" data-mode="calendar">달력</button>
      </div>
      <button class="btn" id="openAdd">+ 이번 주 찬양 기록하기</button>
    </div>
    <div id="timelineList"><div id="timelineContent"></div></div>
    <div id="timelineCalendar" style="display:none;">
      <div class="cal-nav">
        <button class="btn ghost small" id="calPrev">‹ 이전 달</button>
        <div class="cal-title" id="calTitle"></div>
        <button class="btn ghost small" id="calNext">다음 달 ›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>
 
  <!-- Sheet music library -->
  <div class="view" id="view-scores">
    <div class="scores-toolbar">
      <input type="text" id="scoreSearch" class="score-search" placeholder="악보 제목으로 검색">
      <button class="btn" id="openAddScore">+ 악보 추가</button>
    </div>
    <div class="album-grid" id="scoresGrid"></div>
  </div>
 
  <!-- Best playlist view -->
  <div class="view" id="view-best">
    <div class="year-select" id="yearSelect"></div>
    <div id="bestContent"></div>
  </div>
</div>
 
<!-- Add/Edit modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">이번 주 찬양 기록</h2>
    <div class="field">
      <label>날짜</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label>이번 주 주제</label>
      <input type="text" id="f-theme" placeholder="예: 감사, 새 힘, 은혜">
    </div>
    <div class="field">
      <label>기록한 사람</label>
      <input type="text" id="f-name" placeholder="이름">
    </div>
    <div id="songFieldsWrap"></div>
    <button class="add-song-link" id="addSongBtn">+ 곡 추가</button>
    <div class="field">
      <label>소모임 코멘트 (선택)</label>
      <textarea id="f-comment" placeholder="이번 주 나눔이나 선곡 이유를 짧게 남겨보세요"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">취소</button>
      <button class="btn" id="saveBtn">저장하기</button>
    </div>
  </div>
</div>
 
<!-- Day detail modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal"></div>
</div>
 
<!-- Score add/edit modal -->
<div class="overlay" id="scoreFormOverlay">
  <div class="modal">
    <h2 id="scoreModalTitle">악보 추가</h2>
    <div class="field">
      <label>곡 제목</label>
      <input type="text" id="s-title" placeholder="곡 제목">
    </div>
    <div class="field">
      <label>아티스트 (선택)</label>
      <input type="text" id="s-artist" placeholder="아티스트/팀">
    </div>
    <div class="field">
      <label>악보 이미지</label>
      <div class="cover-input">
        <div class="cover-preview" id="scorePreview">이미지 없음</div>
        <div class="cover-controls">
          <input type="file" id="s-file" accept="image/*">
          <input type="text" id="s-url" placeholder="또는 이미지 링크(URL) 붙여넣기">
          <button type="button" class="btn ghost small" id="removeScoreImgBtn">이미지 제거</button>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="scoreCancelBtn">취소</button>
      <button class="btn" id="scoreSaveBtn">저장하기</button>
    </div>
  </div>
</div>
 
<!-- Score viewer modal -->
<div class="overlay" id="scoreViewOverlay">
  <div class="modal" id="scoreViewModal"></div>
</div>
 
<!-- Confirm modal -->
<div class="overlay" id="confirmOverlay">
  <div class="modal" id="confirmModal"></div>
</div>
 
<div class="toast" id="toast"></div>
 
<div class="credit">제작: 바닷가 민물고기</div>
 
<!-- Firebase (Realtime Database) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  authDomain: "project-1162178457745130326.firebaseapp.com",
  databaseURL: "https://project-1162178457745130326-default-rtdb.firebaseio.com",
  projectId: "project-1162178457745130326",
  storageBucket: "project-1162178457745130326.firebasestorage.app",
  messagingSenderId: "213154200752",
  appId: "1:213154200752:web:25f93096380ddaebb2cf75"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const entriesRef = db.ref('entries');
const scoresRef = db.ref('scores');
 
/* ---------- 상태값 ---------- */
let entries = [];
let editingId = null;
let songFieldCount = 0;
 
const overlay = document.getElementById('overlay');
const timelineContent = document.getElementById('timelineContent');
const bestContent = document.getElementById('bestContent');
const yearSelect = document.getElementById('yearSelect');
const songFieldsWrap = document.getElementById('songFieldsWrap');
const toast = document.getElementById('toast');
 
let selectedYear = null;
let calDate = new Date();
calDate.setDate(1);
 
function showToast(msg){
  toast.textContent = msg;

function confirmAction(message){
  return new Promise((resolve)=>{
    const modal = document.getElementById('confirmModal');
    const ov = document.getElementById('confirmOverlay');
    modal.innerHTML = `
      <h2>정말 삭제할까요?</h2>
      <p style="color:var(--ink-soft); font-size:14px; line-height:1.6; margin:0 0 22px;">${escapeHtml(message)}</p>
      <div class="modal-actions">
        <button class="btn ghost" id="confirmNo">취소</button>
        <button class="btn" id="confirmYes">삭제하기</button>
      </div>
    `;
    ov.classList.add('open');
    const finish = (result)=>{
      ov.classList.remove('open');
      resolve(result);
    };
    document.getElementById('confirmYes').addEventListener('click', ()=> finish(true), { once:true });
    document.getElementById('confirmNo').addEventListener('click', ()=> finish(false), { once:true });
  });
}
 
function monthLabel(ym){

function fmtDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return { md: `${d.getMonth()+1}.${d.getDate()}`, wd: ['일','월','화','수','목','금','토'][d.getDay()] };
}
 
function escapeHtml(str){
  const div = document.createElement('div');

}

function renderTimeline(){
  if(entries.length === 0){
    timelineContent.innerHTML = `<div class="empty">

      <div>이번 주 소모임에서 고른 곡부터 남겨보세요.</div>
    </div>`;
    return;
  }
  const groups = {};
  entries.forEach(e=>{
    const ym = (e.date || '').slice(0,7);
    if(!ym) return;
    if(!groups[ym]) groups[ym] = [];
    groups[ym].push(e);
  });
  const months = Object.keys(groups).sort().reverse();
  timelineContent.innerHTML = months.map(ym=>{
    const rows = groups[ym].map(e=>{
      const { md, wd } = fmtDate(e.date);
      const songs = (e.songs || []).map((s,i)=>`
        <li>
          <span class="star ${s.best ? 'on':''}" data-entry="${e.id}" data-song="${i}" title="연말 베스트로 표시">★</span>
          <span class="song-title">${escapeHtml(s.title)}</span>
          ${s.artist ? `<span class="song-artist">· ${escapeHtml(s.artist)}</span>` : ''}
          ${s.link ? `<a class="link" href="${escapeHtml(s.link)}" target="_blank" rel="noopener">듣기</a>` : ''}
        </li>`).join('');
      return `<div class="entry">
        <div class="date"><span class="d">${md}</span>${wd}요일</div>
        <div>
          <div class="theme">${escapeHtml(e.theme || '주제 미정')}</div>
          ${e.name ? `<div class="recorder">기록: ${escapeHtml(e.name)}</div>` : ''}
          <ul class="song-list">${songs}</ul>
          ${e.comment ? `<p class="comment">${escapeHtml(e.comment)}</p>` : ''}
          <div class="entry-actions">
            <button data-edit="${e.id}">수정</button>
            <button data-delete="${e.id}">삭제</button>
          </div>
        </div>
      </div>`;
    }).join('');
    return `<div class="month-group">
      <div class="month-label">${monthLabel(ym)}</div>

    </div>`;
  }).join('');
}

function renderCalendar(){
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  document.getElementById('calTitle').textContent = `${year}년 ${month+1}월`;
 
  const entriesByDate = {};
  entries.forEach(e=>{ if(e.date) entriesByDate[e.date] = e; });
 
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
 
  const dowLabels = ['일','월','화','수','목','금','토'];
  let html = dowLabels.map(d=>`<div class="cal-dow">${d}</div>`).join('');
 
  for(let i=0; i<startOffset; i++){
    html += `<div class="cal-cell empty-cell"></div>`;
  }
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const e = entriesByDate[dateStr];
    if(e){
      html += `<div class="cal-cell has-entry" data-date="${dateStr}">
        <div class="cal-daynum">${day}</div>
        <div class="cal-theme"><span class="cal-dot"></span>${escapeHtml(e.theme || '주제 미정')}</div>
      </div>`;
    } else {
      html += `<div class="cal-cell"><div class="cal-daynum">${day}</div></div>`;
    }
  }
  document.getElementById('calGrid').innerHTML = html;
}

/* 모바일 대용량 이미지 안전 압축 (Realtime DB 용량 제한 최적화) */
function resizeImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 800; // 가로/세로 최대 800px로 리사이징
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.65)); // 65% 압축 품질
      };
      img.onerror = ()=> reject(new Error('image load failed'));
      img.src = ev.target.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

  const date = document.getElementById('f-date').value;
  const theme = document.getElementById('f-theme').value.trim();
  const name = document.getElementById('f-name').value.trim();
  const comment = document.getElementById('f-comment').value.trim();
  if(!date){ showToast('날짜를 선택해 주세요.'); return; }
 
  const songEls = songFieldsWrap.querySelectorAll('.song-fields');
  const songs = [];
  songEls.forEach(el=>{
    const title = el.querySelector('.s-title').value.trim();
    const artist = el.querySelector('.s-artist').value.trim();
    const link = el.querySelector('.s-link').value.trim();
    if(title) songs.push({ title, artist, link, best: false });
  });
  if(songs.length === 0){ showToast('곡을 최소 한 개 이상 입력해 주세요.'); return; }
 
  let finalSongs = songs;
  if(editingId){
    const entry = entries.find(e=>e.id===editingId);
    if(entry){
      finalSongs = songs.map(s=>{
        const prev = (entry.songs || []).find(p=>p.title===s.title);
        return prev ? { ...s, best: prev.best } : s;
      });
    }
  }
 
  const entryData = { date, theme, name, comment, songs: finalSongs };
 
  try{
    if(editingId){
      await entriesRef.child(editingId).update(entryData);
    } else {
      await entriesRef.push(entryData);
    }
    overlay.classList.remove('open');
    showToast('저장했어요.');
  }catch(err){
    showToast('저장에 실패했어요. 다시 시도해 주세요.');
  }
});
 
/* ---------- 실시간 동기화 시작 ---------- */
entriesRef.on('value', (snapshot)=>{
  const val = snapshot.val() || {};
  entries = Object.keys(val).map(key => ({ id: key, ...val[key] }));
  entries.sort((a,b)=> (b.date || '').localeCompare(a.date || ''));
  renderTimeline();
  renderYearSelect();
  renderBest();
  renderCalendar();
}, ()=>{
  showToast('실시간 연결에 실패했어요. 새로고침해 보세요.');
});
 
scoresRef.on('value', (snapshot)=>{
  const val = snapshot.val() || {};
  scores = Object.keys(val).map(key => ({ id: key, ...val[key] }));
  renderScores();
}, ()=>{
  showToast('실시간 연결에 실패했어요. 새로고침해 보세요.');
});
</script>
</body>
