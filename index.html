<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찬양 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :
root{
    --paper: #FFFFFF;
    --paper-deep: #F7F7F7;
    --ink: #25282D;
    --ink-soft: #73777F;
    --navy: #26324A;
    --sage: #6E7F5C;
    --gold: #B8863B;
    --line: #E7E9EC;
    --card: #FBFBFC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    font-weight:300;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold); color:#fff;}
 
  a{color:inherit;}
 
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 24px 120px;
  }
 
  /* Header */
  header.top{
    padding:64px 0 40px;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }
  header.top .kicker{
    font-size:13px;
    color:var(--sage);
    letter-spacing:0.02em;
    margin-bottom:10px;
  }
  header.top h1{
    font-family:'Gowun Dodum', serif;
    font-weight:700;
    font-size:38px;
    color:var(--navy);
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  header.top p{
    color:var(--ink-soft);
    font-size:15px;
    max-width:480px;
    margin:0;
  }
 
  /* Tabs */
  .tabs{
    display:flex;
    gap:4px;
    margin-bottom:36px;
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    background:none;
    border:none;
    font-family:'Gowun Dodum', sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink-soft);
    padding:10px 16px 14px;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  .tab-btn.active{
    color:var(--navy);
    border-bottom:2px solid var(--gold);
  }
 
  .view{display:none;}
  .view.active{display:block;}
 
  /* Add button */
  .add-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
    gap:12px;
    flex-wrap:wrap;
  }
  .mode-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:999px;
    overflow:hidden;
  }
  .mode-btn{
    background:var(--card);
    border:none;
    font-family:'Gowun Dodum', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    padding:7px 16px;
    cursor:pointer;
  }
  .mode-btn.active{
    background:var(--navy);
    color:var(--paper);
  }
  .btn{
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:10px 20px;
    border-radius:12px;
    border:1px solid var(--navy);
    background:var(--navy);
    color:var(--paper);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{background:#33415d; transform:translateY(-1px); box-shadow:0 6px 16px rgba(38,50,74,.12);}
  .btn.ghost{
    background:transparent;
    color:var(--navy);
    border:1px solid var(--line);
  }
  .btn.ghost:hover{border-color:var(--navy);}
  .btn.small{padding:6px 12px; font-size:13px;}
 
  /* Timeline */
  .month-group{margin-bottom:44px;}
  .month-label{
    font-family:'Gowun Dodum', serif;
    font-size:15px;
    font-weight:600;
    color:var(--sage);
    margin-bottom:16px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .entry{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:18px;
    padding:20px 0;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .date{
    font-family:'Gowun Dodum', serif;
    font-size:13px;
    color:var(--ink-soft);
    padding-top:3px;
  }
  .entry .date .d{
    display:block;
    font-size:22px;
    color:var(--navy);
    font-weight:600;
    line-height:1.1;
  }
  .entry .theme{
    font-family:'Gowun Dodum', serif;
    font-size:18px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 10px;
  }
  .recorder{
    font-size:12px;
    color:var(--ink-soft);
    margin:-4px 0 10px;
  }
  .song-list{list-style:none; margin:0 0 10px; padding:0;}
  .song-list li{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:14.5px;
    padding:4px 0;
    color:var(--ink);
  }
  .song-list li .star{
    cursor:pointer;
    color:var(--line);
    font-size:15px;
    user-select:none;
  }
  .song-list li .star.on{color:var(--gold);}
  .song-list li .song-title{font-weight:500;}
  .song-list li .song-artist{color:var(--ink-soft); font-size:13.5px;}
  .song-list li a.link{
    color:var(--sage);
    font-size:12.5px;
    text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .comment{
    font-size:13.5px;
    color:var(--ink-soft);
    font-style:italic;
    margin:8px 0 0;
    padding-left:14px;
    border-left:2px solid var(--line);
  }
  .entry-actions{
    margin-top:10px;
  }
  .entry-actions button{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12px;
    cursor:pointer;
    padding:0;
    margin-right:14px;
    text-decoration:underline;
    text-underline-offset:2px;
  }
 
  .empty{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-soft);
  }
  .empty .big{
    font-family:'Gowun Dodum', serif;
    font-size:20px;
    color:var(--navy);
    margin-bottom:10px;
  }
 
  /* Calendar */
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .cal-title{
    font-family:'Gowun Dodum', serif;
    font-size:18px;
    font-weight:600;
    color:var(--navy);
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
  }
  .cal-dow{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:8px 0;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:var(--paper-deep);
  }
  .cal-cell{
    min-height:84px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:8px 6px;
    position:relative;
  }
  .cal-cell.has-entry{
    background:var(--card);
    cursor:pointer;
  }
  .cal-cell.has-entry:hover{background:#F4F5F6;}
  .cal-cell.empty-cell{background:transparent;}
  .cal-daynum{
    font-size:12px;
    color:var(--ink-soft);
  }
  .cal-cell.has-entry .cal-daynum{color:var(--navy); font-weight:600;}
  .cal-theme{
    font-family:'Gowun Dodum', serif;
    font-size:12.5px;
    color:var(--sage);
    margin-top:6px;
    line-height:1.4;
    word-break:keep-all;
  }
  .cal-dot{
    display:inline-block;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--gold);
    margin-right:4px;
  }
  @media (max-width:520px){
    .cal-cell{min-height:60px; padding:5px 4px;}
    .cal-theme{font-size:10.5px;}
  }
 
  .credit{
    position:fixed;
    right:14px;
    bottom:10px;
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.4;
    pointer-events:none;
    letter-spacing:0.01em;
    z-index:5;
  }
 
  /* Year select for best playlist */
  .year-select{
    display:flex;
    gap:8px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .year-chip{
    border:1px solid var(--line);
    background:var(--card);
    padding:7px 16px;
    border-radius:999px;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .year-chip.active{
    background:var(--navy);
    color:var(--paper);
    border-color:var(--navy);
  }
  .best-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:32px;
  }
  .best-card h2{
    font-family:'Gowun Dodum', serif;
    color:var(--navy);
    font-size:24px;
    margin:0 0 6px;
  }
  .best-card .sub{
    color:var(--ink-soft);
    font-size:13.5px;
    margin-bottom:24px;
  }
  .best-song{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .best-song:last-child{border-bottom:none;}
  .best-song .num{
    font-family:'Gowun Dodum', serif;
    color:var(--gold);
    font-size:16px;
    width:24px;
  }
  .best-song .info .t{font-weight:500; font-size:15px;}
  .best-song .info .a{color:var(--ink-soft); font-size:13px;}
  .best-song .meta{
    margin-left:auto;
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
 
  /* Modal */
  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(25,32,44,0.52);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    z-index:50;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px;
    overflow:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:#FFFFFF;
    border-radius:18px;
    max-width:520px;
    width:100%;
    padding:32px;
    border:1.5px solid #34383F;
    box-shadow:0 20px 60px rgba(22,28,38,0.18);
  }
  .modal h2{
    font-family:'Gowun Dodum', serif;
    color:var(--navy);
    font-size:20px;
    margin:0 0 20px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    padding:9px 11px;
    border:1px solid #555B63;
    border-radius:12px;
    background:#fff;
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:50px;}
  .field input:focus, .field textarea:focus, .score-search:focus{
    outline:none;
    border-color:var(--sage);
    box-shadow:0 0 0 3px rgba(110,127,92,.10);
  }
  .song-fields{
    border:1px solid #6A7078;
    padding:14px;
    border-radius:14px;
    background:#FAFAFA;
    margin-bottom:10px;
    position:relative;
  }
  .song-fields .remove-song{
    position:absolute;
    top:8px;
    right:10px;
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;
  }
  .song-fields .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
  }
  .add-song-link{
    background:none;
    border:none;
    color:var(--sage);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:2px;
    padding:0 0 12px;
  }
 
  /* Cover image input */
  .cover-input{
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .cover-preview{
    width:88px;
    height:88px;
    border-radius:14px;
    border:1px dashed var(--line);
    background:var(--paper-deep);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    overflow:hidden;
  }
  .cover-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .cover-controls{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .cover-controls input[type="file"]{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .cover-controls input[type="text"]{
    width:100%;
    font-family:'Gowun Dodum', sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
  }
 
  /* Album grid */
  .scores-toolbar{
    display:flex;
    gap:12px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .score-search{
    flex:1;
    min-width:160px;
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    padding:9px 14px;
    border:1px solid #555B63;
    border-radius:999px;
    background:var(--card);
    color:var(--ink);
  }
  .album-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  .album-card{
    cursor:pointer;
    transition:transform .16s ease;
  }
  .album-card:hover{transform:translateY(-2px);}
  .album-thumb{
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    background:var(--paper-deep);
    border:1px solid var(--line);
  }
  .album-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .album-thumb.loading{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--ink-soft);
  }
  .album-cap{
    margin-top:8px;
    font-family:'Gowun Dodum', serif;
    font-size:13px;
    color:var(--navy);
    line-height:1.4;
  }
  .album-cap .date{
    display:block;
    font-family:'Gowun Dodum', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  @media (max-width:520px){
    .album-grid{grid-template-columns:repeat(2, 1fr);}
    .cover-input{flex-direction:column;}
  }
 
  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy);
    color:var(--paper);
    padding:12px 22px;
    border-radius:14px;
    font-size:13.5px;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
    z-index:80;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
 
  @media (max-width:520px){
    header.top{padding:44px 0 30px;}
    header.top h1{font-size:30px;}
    .entry{grid-template-columns:48px 1fr; gap:12px;}
    .best-card{padding:22px;}
  }

  /* v4 — 일반 화면 영역 구분 */
  header.top{
    border:1px solid #4A4A46;
    border-radius:18px;
    padding:30px 32px;
    margin-top:34px;
    margin-bottom:28px;
    background:#fff;
  }

  .tabs{
    border:1px solid #5B5B56;
    border-radius:14px;
    padding:4px;
    background:#fff;
    overflow:hidden;
  }

  .tab-btn{
    border-radius:10px;
  }

  .tab-btn.active{
    border-bottom:none;
    background:#F4F4F2;
    box-shadow:inset 0 0 0 1px #6A6A64;
  }

  .mode-toggle{
    border-color:#555550;
  }

  .btn.ghost{
    border-color:#555550;
  }

  .entry{
    border:1px solid #686862;
    border-radius:16px;
    padding:20px 18px;
    margin-bottom:14px;
    background:#fff;
  }

  .entry:last-child{
    border-bottom:1px solid #686862;
  }

  .month-label{
    border-bottom:1px solid #686862;
  }

  .score-search{
    border-color:#555550;
    background:#fff;
  }

  .album-thumb{
    border-color:#555550;
    border-radius:12px;
  }

  .best-card{
    border-color:#555550;
    border-radius:16px;
  }

  .cal-grid{
    border-top-color:#555550;
    border-left-color:#555550;
    border-radius:12px;
    overflow:hidden;
  }

  .cal-dow,
  .cal-cell{
    border-right-color:#777770;
    border-bottom-color:#777770;
  }

  @media (max-width:520px){
    header.top{
      padding:24px 20px;
      margin-top:22px;
      border-radius:15px;
    }
    .entry{
      padding:17px 14px;
      border-radius:14px;
    }
  }


  /* v5 — 홈페이지 내부 YouTube 플레이어 */
  .listen-btn{appearance:none;border:1px solid #4f4f4a;background:#fff;color:var(--ink);border-radius:999px;padding:4px 10px;margin-left:8px;font:inherit;font-size:.82rem;cursor:pointer;transition:.18s ease}
  .listen-btn:hover{background:#f1f1ef;transform:translateY(-1px)}
  .inline-player{display:none;margin:12px 0 4px;width:min(100%,680px);border:1px solid #4f4f4a;border-radius:15px;overflow:hidden;background:#111;box-shadow:0 8px 24px rgba(0,0,0,.10)}
  .inline-player.open{display:block}
  .inline-player iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
  .player-fallback{background:#fff;color:var(--ink-soft);padding:14px 16px;font-size:.88rem}
  .player-fallback a{color:var(--navy);font-weight:700}



  /* v7 — 대한민국 공휴일 + 요일 색상 */
  .cal-dow:first-child{color:#d64242;font-weight:700}
  .cal-dow:last-child{color:#3971c6;font-weight:700}
  .cal-cell.sunday .cal-daynum{color:#d64242;font-weight:700}
  .cal-cell.saturday .cal-daynum{color:#3971c6;font-weight:700}
  .cal-cell.holiday .cal-daynum{color:#d64242;font-weight:800}
  .cal-holiday{
    margin-top:4px;
    color:#d64242;
    font-size:9.5px;
    line-height:1.3;
    font-weight:700;
    word-break:keep-all;
  }
  @media (max-width:520px){
    .cal-holiday{font-size:8px;margin-top:2px}
  }


  /* v8 — 주간 찬양 주제 컬러 칸 */
  .week-theme-badge{
    display:inline-flex;
    align-items:center;
    min-height:25px;
    padding:3px 10px;
    border:1px solid rgba(43,42,37,.55);
    border-radius:7px;
    font-size:12px;
    font-weight:700;
    line-height:1.25;
    color:#2b2a25;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
    vertical-align:middle;
  }
  .theme-color-0{background:#FBE3E3}
  .theme-color-1{background:#FFF0C9}
  .theme-color-2{background:#E1F1DD}
  .theme-color-3{background:#DDECF8}
  .theme-color-4{background:#E9E0F6}
  .theme-color-5{background:#F7E1EE}
  .theme-color-6{background:#DDF2EE}
  .theme-color-7{background:#F1E7D8}

  .entry .week-theme-badge{margin-bottom:7px}
  .cal-theme .week-theme-badge{
    margin-top:0;
    padding:2px 6px;
    min-height:20px;
    font-size:10px;
    border-radius:5px;
    max-width:100%;
    white-space:normal;
  }
  @media(max-width:520px){
    .week-theme-badge{font-size:11px;padding:3px 8px}
    .cal-theme .week-theme-badge{font-size:9px;padding:2px 4px;min-height:18px}
  }


  /* v10 — 악보·가사 뷰어 */
  .music-sheet-btn{
    border:1px solid #5B5B56;background:#fff;color:var(--navy);
    border-radius:9px;padding:6px 9px;margin-left:6px;cursor:pointer;
    font:inherit;font-size:12px;font-weight:700;
  }
  .music-sheet-btn:hover{background:#F4F5F6;}
  .music-modal{max-width:760px;}
  .music-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:14px;}
  .music-head h2{margin:0 0 4px;font-size:23px;}
  .music-sub{color:var(--ink-soft);font-size:13px;}
  .music-tabs{display:flex;gap:7px;border-bottom:1px solid #B9B9B2;margin-bottom:16px;}
  .music-tab{border:0;background:transparent;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink-soft);}
  .music-tab.active{color:var(--navy);font-weight:700;border-bottom:3px solid var(--sage);}
  .music-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0 14px;}
  .music-toolbar button,.music-toolbar select{

/* ---------- 상태값 ---------- */
let entries = [];

function confirmAction(message){
  return new Promise((resolve)=>{
    const modal = document.getElementById('confirmModal');
    const ov = document.getElementById('confirmOverlay');
    modal.innerHTML = `
      <h2>정말 삭제할까요?</h2>

        <button class="btn" id="confirmYes">삭제하기</button>
      </div>
    `;
    ov.classList.add('open');
    const finish = (result)=>{
      ov.classList.remove('open');
      resolve(result);
    };
    document.getElementById('confirmYes').addEventListener('click', ()=> finish(true), { once:true });
    document.getElementById('confirmNo').addEventListener('click', ()=> finish(false), { once:true });
  });
}
 
function monthLabel(ym){
  const [y,m] = ym.split('-');
  return `${y}년 ${parseInt(m,10)}월`;
}
 
function fmtDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return { md: `${d.getMonth()+1}.${d.getDate()}`, wd: ['일','월','화','수','목','금','토'][d.getDay()] };
}
 
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
 
/* ---------- 타임라인 렌더 ---------- */
function renderTimeline(){
  if(entries.length === 0){
    timelineContent.innerHTML = `<div class="empty">
      <div class="big">아직 기록된 찬양이 없어요</div>
      <div>이번 주 소모임에서 고른 곡부터 남겨보세요.</div>
    </div>`;
    return;
  }
  const groups = {};
  entries.forEach(e=>{
    const ym = (e.date || '').slice(0,7);
    if(!ym) return;
    if(!groups[ym]) groups[ym] = [];
    groups[ym].push(e);
  });
  const months = Object.keys(groups).sort().reverse();
  timelineContent.innerHTML = months.map(ym=>{
    const rows = groups[ym].map(e=>{
      const { md, wd } = fmtDate(e.date);
      const songs = (e.songs || []).map((s,i)=>`
        <li>
          <span class="star ${s.best ? 'on':''}" data-entry="${e.id}" data-song="${i}" title="연말 베스트로 표시">★</span>
          <span class="song-title">${escapeHtml(s.title)}</span>
          ${s.artist ? `<span class="song-artist">· ${escapeHtml(s.artist)}</span>` : ''}
          ${s.link ? `<button type="button" class="listen-btn" data-url="${escapeHtml(s.link)}" data-title="${escapeHtml(s.title || '찬양')}" onclick="toggleSongPlayer(event)">▶ 듣기</button><div class="inline-player"></div>` : ''}
          <button type="button" class="music-sheet-btn" data-music-entry="${e.id}" data-music-song="${i}">🎼 악보·가사</button>
        </li>`).join('');
      return `<div class="entry">
        <div class="date"><span class="d">${md}</span>${wd}요일</div>
        <div>
          <div class="theme">${themeBadge(e.theme)}</div>
          ${e.name ? `<div class="recorder">기록: ${escapeHtml(e.name)}</div>` : ''}
          <ul class="song-list">${songs}</ul>
          ${e.comment ? `<p class="comment">${escapeHtml(e.comment)}</p>` : ''}
          <div class="entry-actions">
            <button data-edit="${e.id}">수정</button>
            <button data-delete="${e.id}">삭제</button>
          </div>
        </div>
      </div>`;
    }).join('');
    return `<div class="month-group">
      <div class="month-label">${monthLabel(ym)}</div>
      ${rows}
    </div>`;
  }).join('');
}
 
function renderYearSelect(){
  const years = Array.from(new Set(entries.map(e=> (e.date||'').slice(0,4)).filter(Boolean))).sort().reverse();
  if(years.length === 0){
    yearSelect.innerHTML = '';
    bestContent.innerHTML = `<div class="empty"><div class="big">아직 기록이 없어요</div><div>곡을 기록하고 ★로 표시하면 연말 베스트에 모입니다.</div></div>`;
    return;
  }
  if(!selectedYear || !years.includes(selectedYear)) selectedYear = years[0];
  yearSelect.innerHTML = years.map(y=>
    `<button class="year-chip ${y===selectedYear?'active':''}" data-year="${y}">${y}</button>`
  ).join('');
}
 
function renderBest(){
  if(!selectedYear){ return; }
  const best = [];
  entries.filter(e=> (e.date||'').startsWith(selectedYear)).forEach(e=>{
    (e.songs || []).forEach(s=>{
      if(s.best) best.push({...s, date:e.date, theme:e.theme});
    });
  });
  best.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  if(best.length === 0){
    bestContent.innerHTML = `<div class="best-card">
      <h2>${selectedYear}년 베스트 찬양</h2>
      <div class="sub">타임라인에서 곡 옆 ★을 눌러 올해의 곡으로 표시해 보세요.</div>
      <div class="empty" style="padding:32px 0;">아직 표시된 곡이 없어요.</div>
    </div>`;
    return;
  }
  const rows = best.map((s,i)=>{
    const { md } = fmtDate(s.date);
    return `<div class="best-song">
      <div class="num">${i+1}</div>
      <div class="info">
        <div class="t">${escapeHtml(s.title)}</div>
        <div class="a">${escapeHtml(s.artist || '')}</div>
      </div>
      <div class="meta">${md} · ${escapeHtml(s.theme || '')}</div>
    </div>`;
  }).join('');
  bestContent.innerHTML = `<div class="best-card">
    <h2>${selectedYear}년 베스트 찬양</h2>
    <div class="sub">올 한 해 소모임이 가장 좋아했던 ${best.length}곡</div>
    ${rows}
  </div>`;
}
 


/* ---------- 대한민국 공휴일 ---------- */
function koreanHolidayFor(date){
  const y = date.getFullYear();
  const key = `${y}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;

  /* 현재 사이트에서 사용하는 2026년 달력 기준.
     고정 공휴일 + 설/추석 + 대체공휴일을 표시한다. */
  const holidays2026 = {
    '2026-01-01':'신정',
    '2026-02-16':'설날 연휴',
    '2026-02-17':'설날',
    '2026-02-18':'설날 연휴',
    '2026-03-01':'삼일절',
    '2026-03-02':'대체공휴일',
    '2026-05-01':'노동절',
    '2026-05-05':'어린이날',
    '2026-05-24':'부처님 오신 날',
    '2026-05-25':'대체공휴일',
    '2026-06-06':'현충일',
    '2026-08-15':'광복절',
    '2026-08-17':'대체공휴일',
    '2026-09-24':'추석 연휴',
    '2026-09-25':'추석',
    '2026-09-26':'추석 연휴',
    '2026-10-03':'개천절',
    '2026-10-05':'대체공휴일',
    '2026-10-09':'한글날',
    '2026-12-25':'성탄절'
  };

  /* 고정 날짜 공휴일은 다른 연도에서도 기본 표시 */
  const fixed = {
    '01-01':'신정',
    '03-01':'삼일절',
    '05-01':'노동절',
    '05-05':'어린이날',
    '06-06':'현충일',
    '08-15':'광복절',
    '10-03':'개천절',
    '10-09':'한글날',
    '12-25':'성탄절'
  };

  if(y === 2026 && holidays2026[key]) return holidays2026[key];
  return fixed[key.slice(5)] || null;
}


/* ---------- 주제별 컬러 ---------- */
function themeColorClass(theme){
  const text = String(theme || '주제 미정');
  let hash = 0;
  for(let i=0;i<text.length;i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
  return `theme-color-${Math.abs(hash) % 8}`;
}
function themeBadge(theme){
  const text = theme || '주제 미정';
  return `<span class="week-theme-badge ${themeColorClass(text)}">${escapeHtml(text)}</span>`;
}

/* ---------- 달력 렌더 ---------- */
function renderCalendar(){
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  document.getElementById('calTitle').textContent = `${year}년 ${month+1}월`;
 
  const entriesByDate = {};
  entries.forEach(e=>{ if(e.date) entriesByDate[e.date] = e; });
 
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
 
  const dowLabels = ['일','월','화','수','목','금','토'];
  let html = dowLabels.map(d=>`<div class="cal-dow">${d}</div>`).join('');
 
  for(let i=0; i<startOffset; i++){
    html += `<div class="cal-cell empty-cell"></div>`;
  }
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const e = entriesByDate[dateStr];
    const currentDate = new Date(year, month, day);
    const holiday = koreanHolidayFor(currentDate);
    const dow = currentDate.getDay();
    const dayClass = dow === 0 ? ' sunday' : (dow === 6 ? ' saturday' : '');
    const holidayClass = holiday ? ' holiday' : '';
    const holidayHtml = holiday ? `<div class="cal-holiday">${holiday}</div>` : '';
    if(e){
      html += `<div class="cal-cell has-entry${dayClass}${holidayClass}" data-date="${dateStr}">
        <div class="cal-daynum">${day}</div>
        ${holidayHtml}
        <div class="cal-theme">${themeBadge(e.theme)}</div>
      </div>`;
    } else {
      html += `<div class="cal-cell${dayClass}${holidayClass}"><div class="cal-daynum">${day}</div>${holidayHtml}</div>`;
    }
  }
  document.getElementById('calGrid').innerHTML = html;
}
 
function openDayDetail(dateStr){
  const e = entries.find(en=>en.date===dateStr);
  if(!e) return;
  const { md, wd } = fmtDate(e.date);
  const songs = (e.songs || []).map((s,i)=>`
    <li>
      <span class="song-title">${escapeHtml(s.title)}</span>
      ${s.artist ? `<span class="song-artist">· ${escapeHtml(s.artist)}</span>` : ''}
      <button type="button" class="music-sheet-btn" data-music-entry="${e.id}" data-music-song="${i}">🎼 악보·가사</button>
      ${s.link ? `<button type="button" class="listen-btn" data-url="${escapeHtml(s.link)}" data-title="${escapeHtml(s.title || '찬양')}" onclick="toggleSongPlayer(event)">▶ 듣기</button><div class="inline-player"></div>` : ''}
      ${s.best ? '<span class="cal-dot" title="연말 베스트"></span>' : ''}
    </li>`).join('');
  document.getElementById('detailModal').innerHTML = `
    <h2>${md} (${wd}) · ${escapeHtml(e.theme || '주제 미정')}</h2>
    ${e.name ? `<div class="recorder">기록: ${escapeHtml(e.name)}</div>` : ''}
    <ul class="song-list" style="margin-top:14px;">${songs}</ul>
    ${e.comment ? `<p class="comment">${escapeHtml(e.comment)}</p>` : ''}
    <div class="modal-actions">
      <button class="btn ghost" id="closeDetail">닫기</button>
      <button class="btn" id="editFromDetail">수정하기</button>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('closeDetail').addEventListener('click', ()=>{
    document.getElementById('detailOverlay').classList.remove('open');
  });
  document.getElementById('editFromDetail').addEventListener('click', ()=>{

}

  renderCalendar();
});

  calDate.setMonth(calDate.getMonth()+1);
  renderCalendar();
});
 
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const mode = btn.dataset.mode;
    document.getElementById('timelineList').style.display = mode==='list' ? 'block' : 'none';
    document.getElementById('timelineCalendar').style.display = mode==='calendar' ? 'block' : 'none';

/* 모바일 대용량 이미지 안전 압축 (Realtime DB 용량 제한 최적화) */
function resizeImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 800; // 가로/세로 최대 800px로 리사이징
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.65)); // 65% 압축 품질
      };
      img.onerror = ()=> reject(new Error('image load failed'));
      img.src = ev.target.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

const MUSIC_KEYS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let activeMusicSong = null;
let activeMusicKey = null;
let lyricsFontSize = 20;

const musicSheetOverlay = document.getElementById('musicSheetOverlay');
const keySelect = document.getElementById('keySelect');
keySelect.innerHTML = MUSIC_KEYS.map(k=>`<option value="${k}">${k}</option>`).join('');

function normalizeKey(k){
  const flats = {'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};
  return flats[k] || k;
}
function transposeRoot(root, steps){
  root = normalizeKey(root);
  const idx = MUSIC_KEYS.indexOf(root);
  if(idx < 0) return root;
  return MUSIC_KEYS[(idx + steps + 120) % 12];
}
function transposeChord(chord, steps){
  // C#m7, Bb, G/B, Fadd9 같은 일반 코드의 루트와 슬래시 베이스를 변환
  return chord.replace(/^([A-G](?:#|b)?)([^/]*)(?:\/([A-G](?:#|b)?))?$/, (_,root,tail,bass)=>{
    return transposeRoot(root,steps) + tail + (bass ? '/' + transposeRoot(bass,steps) : '');
  });
}
function transposeChordText(text, steps){
  if(!text || !steps) return text || '';
  // [G], [Em7], [D/F#] 형식을 우선 지원
  return text.replace(/\[([A-G](?:#|b)?(?:m|maj|min|dim|aug|sus|add)?\d*(?:\/[A-G](?:#|b)?)?)\]/g,
    (_, chord)=>'[' + transposeChord(chord, steps) + ']');
}
function songSheet(song){
  return song && song.sheet ? song.sheet : null;
}
function renderMusicSheet(){
  const song = activeMusicSong;
  if(!song) return;
  const sheet = songSheet(song);
  const guitar = document.getElementById('guitarContent');
  const lyrics = document.getElementById('lyricsContent');
  const originalKey = normalizeKey((sheet && sheet.key) || '');
  const currentKey = activeMusicKey || originalKey || '';
  document.getElementById('currentKey').textContent = currentKey || '-';
  keySelect.value = currentKey || 'C';
  keySelect.disabled = !originalKey;
  document.getElementById('keyDown').disabled = !originalKey;
  document.getElementById('keyUp').disabled = !originalKey;

  if(!sheet || (!sheet.chords && !sheet.lyrics)){
    const msg = `<div class="sheet-empty"><strong>악보·가사 데이터가 아직 없어요.</strong>
      YouTube 링크는 등록되어 있습니다. 다음 단계에서 자동 검색 기능을 연결하면 이곳에 가사와 기타 코드가 표시됩니다.</div>`;
    guitar.innerHTML = msg;
    lyrics.innerHTML = msg;
    document.getElementById('capoInfo').textContent = '';
    return;
  }

  let steps = 0;
  if(originalKey && currentKey){
    steps = MUSIC_KEYS.indexOf(currentKey) - MUSIC_KEYS.indexOf(originalKey);
  }
  guitar.textContent = sheet.chords ? transposeChordText(sheet.chords, steps) : '기타 코드 데이터가 아직 없습니다.';
  lyrics.textContent = sheet.lyrics || '가사 데이터가 아직 없습니다.';
  document.getElementById('capoInfo').textContent = sheet.capo ? `Capo ${sheet.capo}` : '';
}
function openMusicSheet(entryId, songIndex){
  const entry = entries.find(x=>x.id===entryId);
  const song = entry && (entry.songs || [])[Number(songIndex)];
  if(!song) return;
  activeMusicSong = song;
  const sheet = songSheet(song);
  activeMusicKey = normalizeKey((sheet && sheet.key) || '') || null;
  lyricsFontSize = 20;
  document.getElementById('lyricsContent').style.fontSize = lyricsFontSize + 'px';
  document.getElementById('musicSheetTitle').textContent = song.title || '악보·가사';
  document.getElementById('musicSheetArtist').textContent = song.artist || '';
  document.querySelectorAll('.music-tab').forEach((b,i)=>b.classList.toggle('active', i===0));
  document.getElementById('guitarPane').style.display = '';
  document.getElementById('lyricsPane').style.display = 'none';
  renderMusicSheet();
  musicSheetOverlay.classList.add('open');
}

<script>

/* v5 — YouTube URL을 페이지 내부 플레이어로 변환 */
function getYouTubeVideoId(url){
  try{
    const u = new URL(url, window.location.href);
    const host = u.hostname.replace(/^www\./,'').toLowerCase();
    if(host === 'youtu.be') return u.pathname.split('/').filter(Boolean)[0] || null;
    if(host.endsWith('youtube.com')){
      if(u.pathname === '/watch') return u.searchParams.get('v');
      const parts = u.pathname.split('/').filter(Boolean);
      if(['embed','shorts','live'].includes(parts[0])) return parts[1] || null;
    }
  }catch(e){}
  return null;
}
function toggleSongPlayer(event){
  event.preventDefault();
  event.stopPropagation();
  const btn = event.currentTarget;
  const url = btn.dataset.url || '';
  const title = btn.dataset.title || 'YouTube 찬양 영상';
  const holder = btn.nextElementSibling;
  if(!holder || !holder.classList.contains('inline-player')) return;

  const alreadyOpen = holder.classList.contains('open');
  document.querySelectorAll('.inline-player.open').forEach(el => {
    el.classList.remove('open');
    el.innerHTML = '';
  });
  document.querySelectorAll('.listen-btn').forEach(el => el.textContent = '▶ 듣기');
  if(alreadyOpen) return;

  const id = getYouTubeVideoId(url);
  if(!id){
    holder.innerHTML = '<div class="player-fallback">이 링크는 페이지 안에서 재생할 수 없어요. <a href="' +
      escapeHtml(url) + '" target="_blank" rel="noopener">원본 링크 열기</a></div>';
  }else{
    holder.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) +
      '?autoplay=1&playsinline=1&rel=0" title="' + escapeHtml(title) +
      '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
      'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' +
      '<div class="player-fallback">외부 재생이 제한된 영상이면 <a href="' + escapeHtml(url) +
      '" target="_blank" rel="noopener">YouTube에서 열기</a></div>';
  }
  holder.classList.add('open');
  btn.textContent = '▲ 닫기';
}

</script>
</body>
</html>
