<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>찬양 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :
root{
    --paper: #FFFFFF;
    --paper-deep: #F7F7F7;
    --ink: #25282D;
    --ink-soft: #73777F;
    --navy: #26324A;
    --sage: #6E7F5C;
    --gold: #B8863B;
    --line: #E7E9EC;
    --card: #FBFBFC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Gowun Dodum', sans-serif;
    font-weight:300;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold); color:#fff;}
 
  a{color:inherit;}
 
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0 24px 120px;
  }
 
  /* Header */
  header.top{
    padding:64px 0 40px;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }
  header.top .kicker{
    font-size:13px;
    color:var(--sage);
    letter-spacing:0.02em;
    margin-bottom:10px;
  }
  header.top h1{
    font-family:'Gowun Dodum', serif;
    font-weight:700;
    font-size:38px;
    color:var(--navy);
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  header.top p{
    color:var(--ink-soft);
    font-size:15px;
    max-width:480px;
    margin:0;
  }
 
  /* Tabs */
  .tabs{
    display:flex;
    gap:4px;
    margin-bottom:36px;
    border-bottom:1px solid var(--line);
  }
  .tab-btn{
    background:none;
    border:none;
    font-family:'Gowun Dodum', sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink-soft);
    padding:10px 16px 14px;
    cursor:pointer;
    position:relative;
    top:1px;
  }
  .tab-btn.active{
    color:var(--navy);
    border-bottom:2px solid var(--gold);
  }
 
  .view{display:none;}
  .view.active{display:block;}
 
  /* Add button */
  .add-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
    gap:12px;
    flex-wrap:wrap;
  }
  .mode-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:999px;
    overflow:hidden;
  }
  .mode-btn{
    background:var(--card);
    border:none;
    font-family:'Gowun Dodum', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
    padding:7px 16px;
    cursor:pointer;
  }
  .mode-btn.active{
    background:var(--navy);
    color:var(--paper);
  }
  .btn{
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    font-weight:500;
    padding:10px 20px;
    border-radius:12px;
    border:1px solid var(--navy);
    background:var(--navy);
    color:var(--paper);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{background:#33415d; transform:translateY(-1px); box-shadow:0 6px 16px rgba(38,50,74,.12);}
  .btn.ghost{
    background:transparent;
    color:var(--navy);
    border:1px solid var(--line);
  }
  .btn.ghost:hover{border-color:var(--navy);}
  .btn.small{padding:6px 12px; font-size:13px;}
 
  /* Timeline */
  .month-group{margin-bottom:44px;}
  .month-label{
    font-family:'Gowun Dodum', serif;
    font-size:15px;
    font-weight:600;
    color:var(--sage);
    margin-bottom:16px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .entry{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:18px;
    padding:20px 0;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .date{
    font-family:'Gowun Dodum', serif;
    font-size:13px;
    color:var(--ink-soft);
    padding-top:3px;
  }
  .entry .date .d{
    display:block;
    font-size:22px;
    color:var(--navy);
    font-weight:600;
    line-height:1.1;
  }
  .entry .theme{
    font-family:'Gowun Dodum', serif;
    font-size:18px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 10px;
  }
  .recorder{
    font-size:12px;
    color:var(--ink-soft);
    margin:-4px 0 10px;
  }
  .song-list{list-style:none; margin:0 0 10px; padding:0;}
  .song-list li{
    display:flex;
    align-items:baseline;
    gap:8px;
    font-size:14.5px;
    padding:4px 0;
    color:var(--ink);
  }
  .song-list li .star{
    cursor:pointer;
    color:var(--line);
    font-size:15px;
    user-select:none;
  }
  .song-list li .star.on{color:var(--gold);}
  .song-list li .song-title{font-weight:500;}
  .song-list li .song-artist{color:var(--ink-soft); font-size:13.5px;}
  .song-list li a.link{
    color:var(--sage);
    font-size:12.5px;
    text-decoration:none;
    border-bottom:1px solid var(--line);
  }
  .comment{
    font-size:13.5px;
    color:var(--ink-soft);
    font-style:italic;
    margin:8px 0 0;
    padding-left:14px;
    border-left:2px solid var(--line);
  }
  .entry-actions{
    margin-top:10px;
  }
  .entry-actions button{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12px;
    cursor:pointer;
    padding:0;
    margin-right:14px;
    text-decoration:underline;
    text-underline-offset:2px;
  }
 
  .empty{
    text-align:center;
    padding:80px 20px;
    color:var(--ink-soft);
  }
  .empty .big{
    font-family:'Gowun Dodum', serif;
    font-size:20px;
    color:var(--navy);
    margin-bottom:10px;
  }
 
  /* Calendar */
  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .cal-title{
    font-family:'Gowun Dodum', serif;
    font-size:18px;
    font-weight:600;
    color:var(--navy);
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
  }
  .cal-dow{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:8px 0;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    background:var(--paper-deep);
  }
  .cal-cell{
    min-height:84px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:8px 6px;
    position:relative;
  }
  .cal-cell.has-entry{
    background:var(--card);
    cursor:pointer;
  }
  .cal-cell.has-entry:hover{background:#F4F5F6;}
  .cal-cell.empty-cell{background:transparent;}
  .cal-daynum{
    font-size:12px;
    color:var(--ink-soft);
  }
  .cal-cell.has-entry .cal-daynum{color:var(--navy); font-weight:600;}
  .cal-theme{
    font-family:'Gowun Dodum', serif;
    font-size:12.5px;
    color:var(--sage);
    margin-top:6px;
    line-height:1.4;
    word-break:keep-all;
  }
  .cal-dot{
    display:inline-block;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--gold);
    margin-right:4px;
  }
  @media (max-width:520px){
    .cal-cell{min-height:60px; padding:5px 4px;}
    .cal-theme{font-size:10.5px;}
  }
 
  .credit{
    position:fixed;
    right:14px;
    bottom:10px;
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.4;
    pointer-events:none;
    letter-spacing:0.01em;
    z-index:5;
  }
 
  /* Year select for best playlist */
  .year-select{
    display:flex;
    gap:8px;
    margin-bottom:28px;
    flex-wrap:wrap;
  }
  .year-chip{
    border:1px solid var(--line);
    background:var(--card);
    padding:7px 16px;
    border-radius:999px;
    font-size:13.5px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .year-chip.active{
    background:var(--navy);
    color:var(--paper);
    border-color:var(--navy);
  }
  .best-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:32px;
  }
  .best-card h2{
    font-family:'Gowun Dodum', serif;
    color:var(--navy);
    font-size:24px;
    margin:0 0 6px;
  }
  .best-card .sub{
    color:var(--ink-soft);
    font-size:13.5px;
    margin-bottom:24px;
  }
  .best-song{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .best-song:last-child{border-bottom:none;}
  .best-song .num{
    font-family:'Gowun Dodum', serif;
    color:var(--gold);
    font-size:16px;
    width:24px;
  }
  .best-song .info .t{font-weight:500; font-size:15px;}
  .best-song .info .a{color:var(--ink-soft); font-size:13px;}
  .best-song .meta{
    margin-left:auto;
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }
 
  /* Modal */
  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(25,32,44,0.52);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    z-index:50;
    align-items:flex-start;
    justify-content:center;
    padding:48px 20px;
    overflow:auto;
  }
  .overlay.open{display:flex;}
  .modal{
    background:#FFFFFF;
    border-radius:18px;
    max-width:520px;
    width:100%;
    padding:32px;
    border:1.5px solid #34383F;
    box-shadow:0 20px 60px rgba(22,28,38,0.18);
  }
  .modal h2{
    font-family:'Gowun Dodum', serif;
    color:var(--navy);
    font-size:20px;
    margin:0 0 20px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    padding:9px 11px;
    border:1px solid #555B63;
    border-radius:12px;
    background:#fff;
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:50px;}
  .field input:focus, .field textarea:focus, .score-search:focus{
    outline:none;
    border-color:var(--sage);
    box-shadow:0 0 0 3px rgba(110,127,92,.10);
  }
  .song-fields{
    border:1px solid #6A7078;
    padding:14px;
    border-radius:14px;
    background:#FAFAFA;
    margin-bottom:10px;
    position:relative;
  }
  .song-fields .remove-song{
    position:absolute;
    top:8px;
    right:10px;
    background:none;
    border:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;
  }
  .song-fields .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
  }
  .add-song-link{
    background:none;
    border:none;
    color:var(--sage);
    font-size:13px;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:2px;
    padding:0 0 12px;
  }
 
  /* Cover image input */
  .cover-input{
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .cover-preview{
    width:88px;
    height:88px;
    border-radius:14px;
    border:1px dashed var(--line);
    background:var(--paper-deep);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    overflow:hidden;
  }
  .cover-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .cover-controls{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .cover-controls input[type="file"]{
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .cover-controls input[type="text"]{
    width:100%;
    font-family:'Gowun Dodum', sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
  }
 
  /* Album grid */
  .scores-toolbar{
    display:flex;
    gap:12px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .score-search{
    flex:1;
    min-width:160px;
    font-family:'Gowun Dodum', sans-serif;
    font-size:14px;
    padding:9px 14px;
    border:1px solid #555B63;
    border-radius:999px;
    background:var(--card);
    color:var(--ink);
  }
  .album-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  .album-card{
    cursor:pointer;
    transition:transform .16s ease;
  }
  .album-card:hover{transform:translateY(-2px);}
  .album-thumb{
    width:100%;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    background:var(--paper-deep);
    border:1px solid var(--line);
  }
  .album-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .album-thumb.loading{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:var(--ink-soft);
  }
  .album-cap{
    margin-top:8px;
    font-family:'Gowun Dodum', serif;
    font-size:13px;
    color:var(--navy);
    line-height:1.4;
  }
  .album-cap .date{
    display:block;
    font-family:'Gowun Dodum', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  @media (max-width:520px){
    .album-grid{grid-template-columns:repeat(2, 1fr);}
    .cover-input{flex-direction:column;}
  }
 
  .toast{
    position:fixed;
    bottom:28px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy);
    color:var(--paper);
    padding:12px 22px;
    border-radius:14px;
    font-size:13.5px;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
    z-index:80;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
 
  @media (max-width:520px){
    header.top{padding:44px 0 30px;}
    header.top h1{font-size:30px;}
    .entry{grid-template-columns:48px 1fr; gap:12px;}
    .best-card{padding:22px;}
  }

  /* v4 — 일반 화면 영역 구분 */
  header.top{
    border:1px solid #4A4A46;
    border-radius:18px;
    padding:30px 32px;
    margin-top:34px;
    margin-bottom:28px;
    background:#fff;
  }

  .tabs{
    border:1px solid #5B5B56;
    border-radius:14px;
    padding:4px;
    background:#fff;
    overflow:hidden;
  }

  .tab-btn{
    border-radius:10px;
  }

  .tab-btn.active{
    border-bottom:none;
    background:#F4F4F2;
    box-shadow:inset 0 0 0 1px #6A6A64;
  }

  .mode-toggle{
    border-color:#555550;
  }

  .btn.ghost{
    border-color:#555550;
  }

  .entry{
    border:1px solid #686862;
    border-radius:16px;
    padding:20px 18px;
    margin-bottom:14px;
    background:#fff;
  }

  .entry:last-child{
    border-bottom:1px solid #686862;
  }

  .month-label{
    border-bottom:1px solid #686862;
  }

  .score-search{
    border-color:#555550;
    background:#fff;
  }

  .album-thumb{
    border-color:#555550;
    border-radius:12px;
  }

  .best-card{
    border-color:#555550;
    border-radius:16px;
  }

  .cal-grid{
    border-top-color:#555550;
    border-left-color:#555550;
    border-radius:12px;
    overflow:hidden;
  }

  .cal-dow,
  .cal-cell{
    border-right-color:#777770;
    border-bottom-color:#777770;
  }

  @media (max-width:520px){
    header.top{
      padding:24px 20px;
      margin-top:22px;
      border-radius:15px;
    }
    .entry{
      padding:17px 14px;
      border-radius:14px;
    }
  }


  /* v5 — 홈페이지 내부 YouTube 플레이어 */
  .listen-btn{appearance:none;border:1px solid #4f4f4a;background:#fff;color:var(--ink);border-radius:999px;padding:4px 10px;margin-left:8px;font:inherit;font-size:.82rem;cursor:pointer;transition:.18s ease}
  .listen-btn:hover{background:#f1f1ef;transform:translateY(-1px)}
  .inline-player{display:none;margin:12px 0 4px;width:min(100%,680px);border:1px solid #4f4f4a;border-radius:15px;overflow:hidden;background:#111;box-shadow:0 8px 24px rgba(0,0,0,.10)}
  .inline-player.open{display:block}
  .inline-player iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
  .player-fallback{background:#fff;color:var(--ink-soft);padding:14px 16px;font-size:.88rem}
  .player-fallback a{color:var(--navy);font-weight:700}



  /* v7 — 대한민국 공휴일 + 요일 색상 */
  .cal-dow:first-child{color:#d64242;font-weight:700}
  .cal-dow:last-child{color:#3971c6;font-weight:700}
  .cal-cell.sunday .cal-daynum{color:#d64242;font-weight:700}
  .cal-cell.saturday .cal-daynum{color:#3971c6;font-weight:700}
  .cal-cell.holiday .cal-daynum{color:#d64242;font-weight:800}
  .cal-holiday{
    margin-top:4px;
    color:#d64242;
    font-size:9.5px;
    line-height:1.3;
    font-weight:700;
    word-break:keep-all;
  }
  @media (max-width:520px){
    .cal-holiday{font-size:8px;margin-top:2px}
  }


  /* v8 — 주간 찬양 주제 컬러 칸 */
  .week-theme-badge{
    display:inline-flex;
    align-items:center;
    min-height:25px;
    padding:3px 10px;
    border:1px solid rgba(43,42,37,.55);
    border-radius:7px;
    font-size:12px;
    font-weight:700;
    line-height:1.25;
    color:#2b2a25;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
    vertical-align:middle;
  }
  .theme-color-0{background:#FBE3E3}
  .theme-color-1{background:#FFF0C9}
  .theme-color-2{background:#E1F1DD}
  .theme-color-3{background:#DDECF8}
  .theme-color-4{background:#E9E0F6}
  .theme-color-5{background:#F7E1EE}
  .theme-color-6{background:#DDF2EE}
  .theme-color-7{background:#F1E7D8}

  .entry .week-theme-badge{margin-bottom:7px}
  .cal-theme .week-theme-badge{
    margin-top:0;
    padding:2px 6px;
    min-height:20px;
    font-size:10px;
    border-radius:5px;
    max-width:100%;
    white-space:normal;
  }
  @media(max-width:520px){
    .week-theme-badge{font-size:11px;padding:3px 8px}
    .cal-theme .week-theme-badge{font-size:9px;padding:2px 4px;min-height:18px}
  }


  /* v18 — DAHAM photo dashboard */
  body{background:#f6f7f8;color:#20242b}
  .site-shell{background:#fff}
  .site-nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 max(28px,calc((100vw - 1180px)/2));background:rgba(255,255,255,.94);border-bottom:1px solid #e7e9ec;position:relative;z-index:4}
  .brand{font-size:29px;font-weight:800;white-space:nowrap;color:#20242b}.brand span{font-size:14px;font-weight:400;color:#777;margin-left:10px}
  .nav-actions{display:flex;align-items:center;gap:5px}.home-nav{border:0;background:transparent;padding:10px 12px;border-radius:10px;font:inherit;font-size:14px;font-weight:700;color:#555;cursor:pointer}.home-nav:hover{background:#f1f3f5;color:#111}.home-nav.active{color:#111;background:#f1f3f5}
  .hero{height:min(650px,70vh);min-height:500px;position:relative;background-image:url('daham-cover.jpeg');background-size:cover;background-position:center 48%;background-repeat:no-repeat;background-color:#1d6970;overflow:hidden}

/* ---------- 대한민국 공휴일 ---------- */
function koreanHolidayFor(date){
  const y = date.getFullYear();
  const key = `${y}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;

  /* 현재 사이트에서 사용하는 2026년 달력 기준.
     고정 공휴일 + 설/추석 + 대체공휴일을 표시한다. */
  const holidays2026 = {
    '2026-01-01':'신정',
    '2026-02-16':'설날 연휴',
    '2026-02-17':'설날',
    '2026-02-18':'설날 연휴',
    '2026-03-01':'삼일절',
    '2026-03-02':'대체공휴일',
    '2026-05-01':'노동절',
    '2026-05-05':'어린이날',
    '2026-05-24':'부처님 오신 날',
    '2026-05-25':'대체공휴일',
    '2026-06-06':'현충일',
    '2026-08-15':'광복절',
    '2026-08-17':'대체공휴일',
    '2026-09-24':'추석 연휴',
    '2026-09-25':'추석',
    '2026-09-26':'추석 연휴',
    '2026-10-03':'개천절',
    '2026-10-05':'대체공휴일',
    '2026-10-09':'한글날',
    '2026-12-25':'성탄절'
  };

  /* 고정 날짜 공휴일은 다른 연도에서도 기본 표시 */
  const fixed = {
    '01-01':'신정',
    '03-01':'삼일절',
    '05-01':'노동절',
    '05-05':'어린이날',
    '06-06':'현충일',
    '08-15':'광복절',
    '10-03':'개천절',
    '10-09':'한글날',
    '12-25':'성탄절'
  };

  if(y === 2026 && holidays2026[key]) return holidays2026[key];
  return fixed[key.slice(5)] || null;
}


/* ---------- 주제별 컬러 ---------- */
function themeColorClass(theme){
  const text = String(theme || '주제 미정');
  let hash = 0;
  for(let i=0;i<text.length;i++) hash = ((hash << 5) - hash + text.charCodeAt(i)) | 0;
  return `theme-color-${Math.abs(hash) % 8}`;
}
function themeBadge(theme){
  const text = theme || '주제 미정';
  return `<span class="week-theme-badge ${themeColorClass(text)}">${escapeHtml(text)}</span>`;
}

/* ---------- 달력 렌더 ---------- */
function renderCalendar(){
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  document.getElementById('calTitle').textContent = `${year}년 ${month+1}월`;
  const now = new Date();
  const isCurrentMonth = year === now.getFullYear() && month === now.getMonth();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
 
  const entriesByDate = {};
  entries.forEach(e=>{ if(e.date) entriesByDate[e.date] = e; });
 
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
 
  const dowLabels = ['일','월','화','수','목','금','토'];
  let html = dowLabels.map((d,i)=>`<div class="cal-dow${isCurrentMonth && i===now.getDay() ? ' today-dow' : ''}">${d}</div>`).join('');
 
  for(let i=0; i<startOffset; i++){
    html += `<div class="cal-cell empty-cell"></div>`;
  }
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const e = entriesByDate[dateStr];
    const currentDate = new Date(year, month, day);
    const holiday = koreanHolidayFor(currentDate);
    const dow = currentDate.getDay();
    const dayClass = dow === 0 ? ' sunday' : (dow === 6 ? ' saturday' : '');
    const holidayClass = holiday ? ' holiday' : '';
    const todayClass = dateStr === todayStr ? ' today' : '';
    const todayHtml = dateStr === todayStr ? '<span class="cal-today">오늘</span>' : '';
    const holidayHtml = holiday ? `<div class="cal-holiday">${holiday}</div>` : '';
    if(e){
      html += `<div class="cal-cell has-entry${dayClass}${holidayClass}${todayClass}" data-date="${dateStr}" title="기록 보기">
        <div class="cal-daynum">${day}${todayHtml}</div>
        ${holidayHtml}
        <div class="cal-theme">${themeBadge(e.theme)}</div>
      </div>`;
    } else {
      html += `<div class="cal-cell${dayClass}${holidayClass}${todayClass}" data-date="${dateStr}" title="이 날짜에 찬양 기록 추가">
        <div class="cal-daynum">${day}${todayHtml}</div>${holidayHtml}<span class="cal-add-hint">+ 기록</span></div>`;
    }
  }
  const usedCells = startOffset + daysInMonth;
  const trailingCells = (7 - (usedCells % 7)) % 7;
  for(let i=0; i<trailingCells; i++) html += `<div class="cal-cell empty-cell"></div>`;
  document.getElementById('calGrid').innerHTML = html;
}

    });
    window.open(`https://calendar.google.com/calendar/render?${params.toString()}`,'_blank','noopener');

  document.getElementById('downloadCalendarFile').addEventListener('click', ()=>{

    const clean = v=>String(v||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
    const details = [...(e.songs || []).map(s=>`${s.title}${s.artist ? ' - '+s.artist : ''}`), e.comment || ''].filter(Boolean).join('\n');
    const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DAHAM//Playlist//KO','BEGIN:VEVENT',
      `DTSTART;VALUE=DATE:${start}`,`DTEND;VALUE=DATE:${end}`,
      `SUMMARY:${clean(`다함 찬양 · ${e.theme || '주제 미정'}`)}`,
      `DESCRIPTION:${clean(details)}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));
    link.download = `daham-${e.date}.ics`;
    link.click();
    setTimeout(()=>URL.revokeObjectURL(link.href),1000);
  });
}

/* 모바일 대용량 이미지 안전 압축 (Realtime DB 용량 제한 최적화) */
function resizeImageFile(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 800; // 가로/세로 최대 800px로 리사이징
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.65)); // 65% 압축 품질
      };
      img.onerror = ()=> reject(new Error('image load failed'));
      img.src = ev.target.result;
    };
    reader.onerror = ()=> reject(new Error('file read failed'));
    reader.readAsDataURL(file);
  });
}

const HOME_FAV_KEY = 'daham_favorite_songs_v20';
function songKey(s){ return `${s.title||''}||${s.artist||''}||${s.link||''}`; }
function getFavorites(){ try{return JSON.parse(localStorage.getItem(HOME_FAV_KEY)||'[]')}catch(e){return[]} }

function flatSongs(){

<script>

/* v5 — YouTube URL을 페이지 내부 플레이어로 변환 */
function getYouTubeVideoId(url){
  try{
    const u = new URL(url, window.location.href);
    const host = u.hostname.replace(/^www\./,'').toLowerCase();
    if(host === 'youtu.be') return u.pathname.split('/').filter(Boolean)[0] || null;
    if(host.endsWith('youtube.com')){
      if(u.pathname === '/watch') return u.searchParams.get('v');
      const parts = u.pathname.split('/').filter(Boolean);
      if(['embed','shorts','live'].includes(parts[0])) return parts[1] || null;
    }
  }catch(e){}
  return null;
}
function getYouTubeEmbedUrl(id){
  const params = new URLSearchParams({autoplay:'1',playsinline:'1',rel:'0'});
  if(location.protocol === 'http:' || location.protocol === 'https:'){
    params.set('origin', location.origin);
    params.set('widget_referrer', location.href);
  }
  return `https://www.youtube.com/embed/${encodeURIComponent(id)}?${params.toString()}`;
}
function toggleSongPlayer(event){
  event.preventDefault();
  event.stopPropagation();
  const btn = event.currentTarget;
  const url = btn.dataset.url || '';
  const title = btn.dataset.title || 'YouTube 찬양 영상';
  const holder = btn.nextElementSibling;
  if(!holder || !holder.classList.contains('inline-player')) return;

  const alreadyOpen = holder.classList.contains('open');
  document.querySelectorAll('.inline-player.open').forEach(el => {
    el.classList.remove('open');
    el.innerHTML = '';
  });
  document.querySelectorAll('.listen-btn').forEach(el => el.textContent = '▶ 듣기');
  document.querySelectorAll('.mini-play').forEach(el => el.textContent = '▶');
  if(alreadyOpen) return;

  const id = getYouTubeVideoId(url);
  if(!id){
    holder.innerHTML = '<div class="player-fallback">이 링크는 페이지 안에서 재생할 수 없어요. <a href="' +
      escapeHtml(url) + '" target="_blank" rel="noopener">원본 링크 열기</a></div>';
  }else{
    holder.innerHTML = '<iframe src="' + escapeHtml(getYouTubeEmbedUrl(id)) + '" title="' + escapeHtml(title) +
      '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
      'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' +
      '<div class="player-fallback">외부 재생이 제한된 영상이면 <a href="' + escapeHtml(url) +
      '" target="_blank" rel="noopener">YouTube에서 열기</a></div>';
  }
  holder.classList.add('open');
  btn.textContent = '▲ 닫기';
}

function toggleHomeSongPlayer(event){
  event.preventDefault();
  event.stopPropagation();
  const btn = event.currentTarget;
  const wrap = btn.closest('.mini-song-wrap');
  const holder = wrap && wrap.querySelector('.inline-player');
  if(!holder) return;
  const alreadyOpen = holder.classList.contains('open');

  document.querySelectorAll('.inline-player.open').forEach(el=>{
    el.classList.remove('open');
    el.innerHTML = '';
  });
  document.querySelectorAll('.listen-btn').forEach(el=>el.textContent='▶ 듣기');
  document.querySelectorAll('.mini-play').forEach(el=>el.textContent='▶');
  if(alreadyOpen) return;

  const url = btn.dataset.url || '';
  const id = getYouTubeVideoId(url);
  if(!id){
    holder.innerHTML = '<div class="player-fallback">이 링크 형식은 홈페이지에서 재생할 수 없어요. <a href="' +
      escapeHtml(url) + '" target="_blank" rel="noopener">원본 링크 열기</a></div>';
  }else{
    holder.innerHTML = '<iframe src="' + escapeHtml(getYouTubeEmbedUrl(id)) + '" title="' + escapeHtml(btn.dataset.title || 'YouTube 찬양 영상') +
      '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
      'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>' +
      '<div class="player-fallback">영상 소유자가 외부 재생을 막은 경우에만 <a href="' + escapeHtml(url) +
      '" target="_blank" rel="noopener">YouTube에서 열기</a></div>';
  }
  holder.classList.add('open');
  btn.textContent = '▲';
}

</script>
</body>
</html>
